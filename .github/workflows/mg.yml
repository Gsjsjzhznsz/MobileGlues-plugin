name: MobileGlues

on:
  push:
    branches:
      - main
      - dev
      - mg-3backends
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # mg-3backends: recursive checkout of everything drags in DiligentCore
      # (commented out in CMake), apitrace (trace_replay only) and tracy
      # (profiling only) — a 55-minute clone for nothing. The Android build
      # needs exactly: MobileGlues (recursive), MobileGL, and the MobileGL
      # 3rdparty set that the root CMakeLists add_subdirectory's unconditionally.
      - name: Init submodules (Android build set)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive MobileGlues
          git submodule update --init MobileGL
          git -C MobileGL submodule update --init --recursive \
            3rdparty/glslang \
            3rdparty/SPIRV-Cross \
            3rdparty/Vulkan-Headers \
            3rdparty/Vulkan-Utility-Libraries \
            3rdparty/VulkanMemoryAllocator \
            3rdparty/SPIRV-Reflect \
            3rdparty/xxHash \
            3rdparty/asio \
            include/ska

      # glslang no longer registers its External deps as submodules; this
      # script fetches spirv-tools/spirv-headers so ENABLE_OPT=ON configures.
      - name: Update glslang external sources
        working-directory: MobileGL/3rdparty/glslang
        run: python update_glslang_sources.py

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # mg-3backends: android-actions/setup-android@v3 currently fails trying
      # to install the removed 'tools' package. The runner image already ships
      # a full SDK at $ANDROID_HOME — just accept licenses and add the NDK.
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" >/dev/null
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # mg-3backends: arm64-v8a by default (the same default the modules pick
      # up); pass MOBILEGL_ABIS="arm64-v8a,x86_64" via workflow_dispatch vars
      # if an emulator-capable build is needed.
      - name: Build apk
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MOBILEGL_ABIS: arm64-v8a

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.repository_name }}_${{ env.date_today }}_${{ github.sha }}
          path: app/build/outputs/apk/release/
